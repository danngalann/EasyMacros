name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: easymacros_test
          POSTGRES_USER: easymacros
          POSTGRES_PASSWORD: test-password
        options: >-
          --health-cmd "pg_isready -U easymacros -d easymacros_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://easymacros:test-password@127.0.0.1:5432/easymacros_test
      JWT_SECRET: ci-secret-that-is-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make format-check lint test-backend openapi-check
      - run: pnpm --filter @easymacros/backend migrate
      - run: pnpm --filter @easymacros/backend typecheck
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses list --prod

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && ./gradlew lint test assembleDebug

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --tag easymacros-api:ci .
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: easymacros-api:ci
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - run: POSTGRES_DB=easymacros POSTGRES_USER=easymacros POSTGRES_PASSWORD=test-password JWT_SECRET=ci-secret-that-is-at-least-thirty-two-bytes docker compose -f docker-compose.prod.yml config >/dev/null

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
