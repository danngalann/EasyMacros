services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - easymacros-production-postgres:/var/lib/postgresql/data
    networks:
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  image-jobs-init:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/easymacros/images && chown -R node:node /var/lib/easymacros/images",
      ]
    volumes:
      - easymacros-production-image-jobs:/var/lib/easymacros/images
    read_only: true
    restart: "no"

  api:
    container_name: easymacros
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-easymacros}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-easymacros-mobile}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-30}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-0}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      PUBLIC_AUTH_RATE_LIMIT_MAX: ${PUBLIC_AUTH_RATE_LIMIT_MAX:-20}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      OPEN_FOOD_FACTS_ENABLED: ${OPEN_FOOD_FACTS_ENABLED:-false}
      OPEN_FOOD_FACTS_BASE_URL: ${OPEN_FOOD_FACTS_BASE_URL:-https://world.openfoodfacts.org}
      OPEN_FOOD_FACTS_USER_AGENT: ${OPEN_FOOD_FACTS_USER_AGENT:-}
      OPEN_FOOD_FACTS_COUNTRY: ${OPEN_FOOD_FACTS_COUNTRY:-de}
      OPEN_FOOD_FACTS_LANGUAGE: ${OPEN_FOOD_FACTS_LANGUAGE:-en}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_ADVANCED_MODEL: ${OPENROUTER_ADVANCED_MODEL:-google/gemini-3.7-flash}
      IMAGE_JOB_DIRECTORY: /var/lib/easymacros/images
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-10}
      AI_MAX_UPLOAD_BYTES: ${AI_MAX_UPLOAD_BYTES:-8388608}
    volumes:
      - easymacros-production-image-jobs:/var/lib/easymacros/images
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    networks:
      - database
      - proxy
    depends_on:
      db:
        condition: service_healthy
      image-jobs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

networks:
  database:
    internal: true
  proxy:
    external: true
    name: proxy

volumes:
  easymacros-production-postgres:
  easymacros-production-image-jobs:
